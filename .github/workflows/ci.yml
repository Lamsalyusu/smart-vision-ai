name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Python (FastAPI service and domain code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy . --ignore-missing-imports

      - name: Test
        run: python -m pytest -q core/tests

  vision:
    name: Vision service (Django + trained model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache LFS objects so each run does not spend LFS bandwidth on the weights.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Fetch model weights
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legacy_django/requirements-vision.txt

      - name: Install dependencies
        run: pip install -r legacy_django/requirements-vision.txt

      - name: Test
        working-directory: legacy_django
        env:
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
          DJANGO_DEBUG: "True"
        run: python manage.py test backend

  web:
    name: Next.js app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [core, vision, web]
    env:
      INTERNAL_API_TOKEN: ci-internal-token-not-a-secret
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - uses: actions/checkout@v4

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Fetch model weights
        run: git lfs pull

      - name: Build images
        run: docker compose build

      - name: Start stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check services
        run: |
          curl -fsS http://localhost:8000/health
          # FastAPI must refuse data requests without the service token.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/stats)" = "401"
          curl -fsS -H "X-Internal-Token: $INTERNAL_API_TOKEN" http://localhost:8000/stats
          # Protected pages redirect anonymous users to /login.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/camera)" = "307"
          curl -fsS -o /dev/null http://localhost:3000/login

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
