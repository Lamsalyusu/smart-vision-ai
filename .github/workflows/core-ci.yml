name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install core validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.5.3 scipy==1.17.1 ruff==0.15.6 mypy==1.19.1 httpx==0.28.1
      - name: Lint core
        run: ruff check core --select E,F,W,C90 --ignore E501,F401,F403,F405,C901,E402,F402,F821,F841,E722,F811,E741,E731,E701,F823
      - name: Check domain types
        run: mypy core --ignore-missing-imports
      - name: Run core tests
        run: python -m pytest -q core/tests