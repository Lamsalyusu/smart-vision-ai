name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core validation dependencies
        run: python -m pip install numpy scipy ruff mypy
      - name: Lint core
        run: make lint-core
      - name: Check domain types
        run: make type-check-core
      - name: Run core tests
        run: make PYTHON=python test-core