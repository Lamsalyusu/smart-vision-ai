services:
  web:
    build: .
    container_name: smart_vision_ai
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SECRET_KEY=${SECRET_KEY}
      - AUTH_API_URL=http://auth:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env (openssl rand -hex 32)}
      - VISION_API_URL=${VISION_API_URL:-http://vision:8001/api/detect/}
    depends_on:
      auth:
        condition: service_healthy
      vision:
        condition: service_healthy

  vision:
    build:
      context: ./legacy_django
      dockerfile: Dockerfile.vision
    container_name: smart_vision_ai_vision
    ports:
      - "8001:8001"
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env (openssl rand -hex 32)}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,host.docker.internal,vision}
      - RTSP_ALLOWED_HOSTS=${RTSP_ALLOWED_HOSTS:-}
      - RTSP_MAX_STREAMS=${RTSP_MAX_STREAMS:-50}
      - RTSP_RECONNECT_DELAY_SECONDS=${RTSP_RECONNECT_DELAY_SECONDS:-1.0}
      - OFFLINE_MODE=${OFFLINE_MODE:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  auth:
    build:
      context: .
      dockerfile: core/infrastructure/api/Dockerfile
    container_name: smart_vision_ai_auth
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - SECRET_KEY=${SECRET_KEY:-}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env (openssl rand -hex 32)}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-smart_vision_ai}
      - POSTGRES_HOST=db
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: smart_vision_ai_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-smart_vision_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_vision_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
