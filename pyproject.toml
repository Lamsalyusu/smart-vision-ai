[tool.ruff]
line-length = 88
extend-exclude = ["144_2432214_YuyutsuLamsal_ObjectDetectionModel.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501", "F401", "F403", "F405"]

[tool.ruff.lint.flake8-type-checking]
ignore = ["TC001", "TC002", "TC003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_subclassing_any = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
disable_error_code = ["misc", "no-any-return", "union-attr"]