{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
    }
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Smart Vision</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <style>
        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #101922;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        .page-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        /* ============================================
           CARD
           ============================================ */
        .card {
            background: #1c2532;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid #324d67;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #137fec 0%, #9333ea 50%, #137fec 100%);
        }

        /* ============================================
           LOGO & HEADER
           ============================================ */
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, #137fec 0%, #9333ea 100%);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(19, 127, 236, 0.3);
        }

        .logo-icon .material-symbols-outlined {
            font-size: 2rem;
            color: white;
        }

        .header-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .header-subtitle {
            color: #92adc9;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        /* ============================================
           SUCCESS MESSAGE
           ============================================ */
        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.5);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .success-message-content {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .success-icon {
            color: #22c55e;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .success-text {
            flex: 1;
        }

        .success-text h3 {
            color: #22c55e;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .success-text p {
            color: #4ade80;
            font-size: 0.75rem;
            line-height: 1.5;
        }

        /* ============================================
           ERROR MESSAGE
           ============================================ */
        .error-message {
            margin-bottom: 1.5rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .error-message p {
            color: #f87171;
            font-size: 0.875rem;
        }

        /* ============================================
           FORM STYLES
           ============================================ */
        .form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            color: white;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #92adc9;
            font-size: 1.25rem;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 3.5rem;
            padding: 0 1rem 0 2.5rem;
            background-color: #192633;
            border: 1px solid #324d67;
            border-radius: 0.5rem;
            color: white;
            font-size: 0.875rem;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #137fec;
            box-shadow: 0 0 0 3px rgba(19, 127, 236, 0.1);
        }

        .form-input:focus + .input-icon {
            color: #137fec;
        }

        .input-wrapper:focus-within .input-icon {
            color: #137fec;
        }

        .form-input::placeholder {
            color: #636b7e;
        }

        /* ============================================
           SUBMIT BUTTON
           ============================================ */
        .submit-button {
            position: relative;
            width: 100%;
            height: 3rem;
            background: #137fec;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(19, 127, 236, 0.25);
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .submit-button:hover {
            background: #0d6ad1;
            transform: translateY(-2px);
            box-shadow: 0 15px 20px -3px rgba(19, 127, 236, 0.35);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* ============================================
           FOOTER LINKS
           ============================================ */
        .footer-links {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #324d67;
            text-align: center;
        }

        .back-to-login {
            color: #92adc9;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .back-to-login:hover {
            color: #137fec;
        }

        .back-to-login .material-symbols-outlined {
            font-size: 1rem;
        }

        /* ============================================
           INFO BOX
           ============================================ */
        .info-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 0.5rem;
        }

        .info-box-content {
            display: flex;
            gap: 0.75rem;
        }

        .info-icon {
            color: #60a5fa;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .info-text {
            flex: 1;
        }

        .info-text p {
            color: #92adc9;
            font-size: 0.75rem;
            line-height: 1.5;
        }

        /* ============================================
           RESPONSIVE DESIGN
           ============================================ */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }

            .header-title {
                font-size: 1.5rem;
            }

            .form-input {
                height: 3rem;
            }

            .submit-button {
                height: 2.75rem;
            }
        }
    </style>
</head>

<body>
    <div class="page-wrapper">
        <div class="container">
            <div class="card">
                
                <!-- Logo & Header -->
                <div class="logo-section">
                    <div class="logo-icon">
                        <span class="material-symbols-outlined">lock_reset</span>
                    </div>
                    <h1 class="header-title">Forgot Password?</h1>
                    <p class="header-subtitle">
                        No worries! Enter your email address and we'll send you a reset link.
                    </p>
                </div>

                <!-- Success Message (Hidden by default) -->
                <div id="successMessage" class="success-message">
                    <div class="success-message-content">
                        <span class="material-symbols-outlined success-icon">check_circle</span>
                        <div class="success-text">
                            <h3>Email Sent!</h3>
                            <p>Check your inbox for password reset instructions. The link will expire in 1 hour.</p>
                        </div>
                    </div>
                </div>

                <!-- Error Message -->
                {% if error %}
                <div class="error-message">
                    <p>{{ error }}</p>
                </div>
                {% endif %}

                <!-- Forgot Password Form -->
                <form method="POST" action="{% url 'forgot_password' %}" class="form" id="forgotPasswordForm">
                    {% csrf_token %}
                    
                    <!-- Email Input -->
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <input 
                                type="email" 
                                name="email" 
                                id="emailInput"
                                class="form-input" 
                                placeholder="name@company.com" 
                                required
                            />
                            <span class="material-symbols-outlined input-icon">mail</span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-button">
                        <span class="button-content">
                            <span class="material-symbols-outlined">send</span>
                            Send Reset Link
                        </span>
                    </button>
                </form>

                <!-- Info Box -->
                {% comment %} <div class="info-box">
                    <div class="info-box-content">
                        <span class="material-symbols-outlined info-icon">info</span>
                        <div class="info-text">
                            <p>
                                <strong>Can't find the email?</strong> Check your spam folder or contact support at support@smartvision.ai
                            </p>
                        </div>
                    </div>
                </div> {% endcomment %}

                <!-- Footer Links -->
                <div class="footer-links">
                    <a href="{% url 'login' %}" class="back-to-login">
                        <span class="material-symbols-outlined">arrow_back</span>
                        Back to Login
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Show success message on successful submission
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            document.getElementById('successMessage').classList.add('show');
            document.getElementById('forgotPasswordForm').style.display = 'none';
        }

        // Optional: Add email validation
        const emailInput = document.getElementById('emailInput');
        emailInput.addEventListener('blur', function() {
            const email = this.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (email && !emailRegex.test(email)) {
                this.style.borderColor = '#ef4444';
            } else {
                this.style.borderColor = '#324d67';
            }
        });
    </script>

</body>
</html>
