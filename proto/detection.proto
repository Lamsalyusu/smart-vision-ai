syntax = "proto3";

package smartvision.v1;

option go_package = "github.com/Lamsalyusu/smart-vision-ai/gen/go/smartvision/v1;smartvisionv1";

message BoundingBox {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
}

message Detection {
  string class_name = 1;
  float confidence = 2;
  BoundingBox bbox = 3;
  optional uint64 track_id = 4;
  optional float velocity_x = 5;
  optional float velocity_y = 6;
}

message DetectionBatch {
  string camera_id = 1;
  uint64 frame_sequence_number = 2;
  int64 processed_at_unix_micros = 3;
  repeated Detection detections = 4;
}