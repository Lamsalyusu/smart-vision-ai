syntax = "proto3";

package smartvision.v1;

option go_package = "github.com/Lamsalyusu/smart-vision-ai/gen/go/smartvision/v1;smartvisionv1";

enum CameraHealth {
  CAMERA_HEALTH_UNSPECIFIED = 0;
  CAMERA_HEALTH_STARTING = 1;
  CAMERA_HEALTH_HEALTHY = 2;
  CAMERA_HEALTH_DEGRADED = 3;
  CAMERA_HEALTH_OFFLINE = 4;
}

message CameraTelemetry {
  string camera_id = 1;
  int64 observed_at_unix_micros = 2;
  CameraHealth health = 3;
  double frames_per_second = 4;
  double inference_latency_p50_ms = 5;
  double inference_latency_p99_ms = 6;
  uint64 frames_received = 7;
  uint64 frames_dropped = 8;
  uint64 active_tracks = 9;
  string detail = 10;
}