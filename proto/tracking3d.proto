syntax = "proto3";

package smartvision.v1;

option go_package = "github.com/Lamsalyusu/smart-vision-ai/gen/go/smartvision/v1;smartvisionv1";

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message TrackState3D {
  string track_id = 1;
  string class_name = 2;
  repeated double state = 3 [packed = true];
  Vector3 position_m = 4;
  Vector3 velocity_mps = 5;
  double heading_rad = 6;
  double heading_rate_radps = 7;
  uint64 last_frame_sequence_number = 8;
  int64 updated_at_unix_micros = 9;
}

message Tracking3DBatch {
  string camera_id = 1;
  uint64 frame_sequence_number = 2;
  repeated TrackState3D tracks = 3;
}