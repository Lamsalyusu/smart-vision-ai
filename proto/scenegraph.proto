syntax = "proto3";

package smartvision.v1;

option go_package = "github.com/Lamsalyusu/smart-vision-ai/gen/go/smartvision/v1;smartvisionv1";

import "detection.proto";
import "tracking3d.proto";

message SceneGraphNode {
  string node_id = 1;
  Detection detection = 2;
  TrackState3D track = 3;
}

message SceneGraphEdge {
  string source_node_id = 1;
  string target_node_id = 2;
  string relation = 3;
  optional double distance_m = 4;
  bool directional = 5;
}

message SceneGraph {
  string camera_id = 1;
  uint64 frame_sequence_number = 2;
  int64 observed_at_unix_micros = 3;
  repeated SceneGraphNode nodes = 4;
  repeated SceneGraphEdge edges = 5;
}